[package]
name = "ykoxide"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "YubiKey toolkit: age, PIV, FIDO2 and challenge-response file encryption and SSH signing in a single binary"
license = "MIT"
repository = "https://github.com/Esl1h/ykoxide"
keywords = ["yubikey", "age", "fido2", "piv", "encryption"]
categories = ["command-line-utilities", "cryptography", "hardware-support"]

# cargo-binstall downloads the release tarballs instead of building from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ykoxide-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "ykoxide-{ version }-{ target }/{ bin }{ binary-ext }"

[[bin]]
name = "ykox"
path = "src/main.rs"

[dependencies]
aes = "0.9.3"
age = { version = "0.12.1", features = ["armor", "cli-common", "plugin"] }
age-core = "0.12"
anyhow = "1"
base64 = "0.23.1"
bech32 = "0.9.1"
cbc = { version = "0.2.1", features = ["alloc"] }
challenge_response = { version = "0.5.46", default-features = false, features = ["nusb"] }
clap = { version = "4", features = ["derive"] }
ctap-hid-fido2 = "3.5.9"
der = "0.8.2"
dirs = "7.0.0"
hex = "0.4.3"
hmac = "0.13.0"
nusb = "0.2.7"
p256 = "0.13.2"
pbkdf2 = "0.13.0"
pcsc = "2.9.0"
rpassword = "7.5.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ssh-key = { version = "0.6.7", features = ["crypto", "encryption"] }
tempfile = "3.27.0"
x509-cert = "0.2.5"
yubikey = { version = "0.8.0", features = ["untested"] }
zeroize = "1.9.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
age = "0.12.1"
assert_cmd = "2.2.2"
predicates = "3.1.4"
