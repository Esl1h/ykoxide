[package]
name = "ykoxide"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "YubiKey toolkit: age, PIV and challenge-response file encryption in a single binary"
license = "MIT"
repository = "https://github.com/Esl1h/ykoxide"

[[bin]]
name = "ykox"
path = "src/main.rs"

[dependencies]
aes = "0.9.2"
age = { version = "0.12.1", features = ["armor", "cli-common", "plugin"] }
anyhow = "1"
cbc = { version = "0.2.1", features = ["alloc"] }
challenge_response = { version = "0.5.46", default-features = false, features = ["nusb"] }
clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
hex = "0.4.3"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
rpassword = "7.5.4"
secrecy = "0.10.3"
sha2 = "0.11.0"
tempfile = "3.27.0"
yubikey = "0.8.0"
zeroize = "1.9.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
age = "0.12.1"
assert_cmd = "2.2.2"
predicates = "3.1.4"
