name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@v7
      # An explicit workflow instead of the default setup: the default setup
      # API does not accept rust as a language yet.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
