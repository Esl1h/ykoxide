name: release

on:
  push:
    tags: ['v*']

env:
  BIN: ykox

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          # Native runner: pcsc-sys and hidapi find the target's libpcsclite
          # and libudev through pkg-config, which refuses to cross-compile.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Both runners are native for their target, so the test suite runs
      # against the binaries that are about to be released.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          dir="ykoxide-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "$dir"
          cp target/${{ matrix.target }}/release/${BIN} "$dir"/
          cp README.md LICENSE "$dir"/
          tar czf "${dir}.tar.gz" "$dir"
          sha256sum "${dir}.tar.gz" >> SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ykoxide-*.tar.gz
            SHA256SUMS

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Merge checksums
        run: cat release-*/SHA256SUMS > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-*/ykoxide-*.tar.gz
            SHA256SUMS
